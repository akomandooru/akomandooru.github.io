name: Nightly Traffic Analytics Backup

on:
  schedule:
    - cron: '17 3 * * *' # Runs at 3:17 AM UTC, completely skipping peak congestion windows
  workflow_dispatch: # Allows you to run it manually to test it

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch and Archive Traffic Data
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          filename: github-metrics.svg
          
          # TARGET SPECIFIC REPOSITORY AND POST PATHS
          user: akomandooru
          repo: akomandooru.github.io
          template: repository
          base: "" # Disables general account activity blocks to save space
          
          # ENABLE GRANULAR TRAFFIC ANALYSIS
          plugin_traffic: yes
