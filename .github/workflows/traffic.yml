name: Nightly Traffic Analytics Backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch and Render Blog Posts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          
          # 📑 TARGET DESTINATION LOCATION
          filename: github-metrics.svg
          committer_branch: main
          
          # 👤 PROFILE IDENTITY DEFINITION
          user: akomandooru
          template: classic
          base: ""

          # 📏 CANVAS LAYOUT & EXPANSION
          config_order: rss
          config_padding: 0, 24 + 15%
          
          # ✒️ RSS
          plugin_rss: yes
          plugin_rss_source: https://akomandooru.github.io/feed.xml
          plugin_rss_limit: 4
