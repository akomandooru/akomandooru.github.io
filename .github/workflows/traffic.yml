name: Nightly Traffic Analytics Backup

on:
  schedule:
    - cron: '17 3 * * *' # Runs at 3:17 AM UTC
  workflow_dispatch: # Allows you to run it manually to test it

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          committer_token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch and Render Blog Posts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          filename: github-metrics.svg
          
          user: akomandooru
          template: classic
          base: "" 
          
          # ✒️ JEKYLL RSS BLOG CONFIGURATION
          plugin_posts: yes
          plugin_posts_source: rss
          plugin_posts_user: "https://github.io"
          plugin_posts_limit: 4
          plugin_posts_descriptions: yes
