name: Nightly Traffic Analytics Backup

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight UTC
  workflow_dispatch: # Allows you to run it manually to test it

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch and Archive Traffic Data
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          base: repositories
          plugin_traffic: yes
          output_action: commit
