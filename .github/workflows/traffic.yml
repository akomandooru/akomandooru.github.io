name: Nightly Traffic Analytics Backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Fetch and Render Blog Posts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          committer_token: ${{ secrets.TRAFFIC_TOKEN }}
          
          # 📑 TARGET DESTINATION LOCATION
          filename: github-metrics.svg
          committer_branch: main
          
          # 👤 PROFILE IDENTITY DEFINITION
          user: akomandooru
          template: classic
          base: ""
          
          # ✒️ BYPASS GITHUB.IO PARSER STRIPPING
          plugin_posts: yes
          plugin_posts_source: rss
          # Masking the literal string sequence allows it to pass raw values safely
          plugin_posts_user: "https://github.io" 
          plugin_posts_limit: 4
