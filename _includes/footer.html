<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>

  <div class="wrapper">
    <!-- Main Footer Row -->
    <div class="footer-col-wrapper" style="display: flex; justify-content: space-between; font-weight: 300; font-size: 13px; color: #828282; margin-bottom: 15px;">
      
      <!-- Left Side: Blog Name -->
      <div class="footer-col">
        <p>{{ site.author.name | escape }}'s Blog</p>
      </div>

      <!-- Right Side: Clean Copyright Line -->
      <div class="footer-col" style="text-align: right;">
        <p>&copy; {{ 'now' | date: "%Y" }} • All observations recorded.</p>
      </div>

    </div>

    <!-- Muted Professional Disclaimer Line -->
    <div style="border-top: 1px solid #e8e8e8; padding-top: 12px; font-weight: 300; font-size: 11px; color: #b5b5b5; text-align: center; font-style: italic; line-height: 1.4;">
      Any opinions expressed in these articles are those of the individual author and do not necessarily reflect the views or opinions of my employer.
    </div>
  </div>
</footer>
